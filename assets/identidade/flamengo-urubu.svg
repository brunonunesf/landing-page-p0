  <path fill="#e9d1a4" stroke="#08090c" stroke-width="7" stroke-linejoin="round" d="m186 126 23-8 25-9 37 19 13 18-3 29-16 17 1-27-27-9-24 7-29-11-14-14Z"/>
  <path fill="#b99463" d="m185 142 30 10 24-6 29 10 8 13-1-21-22-13-37 6-21-9Z"/>
  <path fill="#fff0cf" d="m214 124 18-6 30 15-27-6-20 6Z"/>
  <path fill="#101014" d="m226 132 10-3 9 7-16 1Z"/>
  <path fill="#d8bb8b" stroke="#08090c" stroke-width="6" stroke-linejoin="round" d="m184 153 29 12 27-4 18 7-17 14-29 1-24-12-13-14Z"/>
  <path fill="none" stroke="#77727a" stroke-width="4" stroke-linecap="round" d="m121 136 15 13 14 2"/>
